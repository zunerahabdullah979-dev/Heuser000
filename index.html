<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a Heuser Website</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17324d; background: #f3f8f6; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(680px, 100%); text-align: center; }
      h1 { margin-bottom: 8px; }
      p { color: #526579; }
      .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 28px; }
      a { display: block; padding: 24px; border: 1px solid #d5e3dd; border-radius: 16px; background: white; color: inherit; text-decoration: none; box-shadow: 0 8px 24px #17324d12; }
      a:hover, a:focus-visible { border-color: #3a8b76; transform: translateY(-2px); }
      strong, span { display: block; }
      span { margin-top: 8px; color: #526579; }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome to Heuser</h1>
      <p>Choose which website you want to open.</p>
      <div class="links">
        <a href="CS_CRP/Homework_7/">
          <strong>Heuser Game</strong>
          <span>Dewdrop's Rainy Day Garden</span>
        </a>
        <a href="https://zunerahabdullah979-dev.github.io/Heuser02/CS_CRP/Homework_8/">
          <strong>Heuser Portfolio</strong>
          <span>Open the Heuser portfolio website</span>
        </a>
      </div>
    </main>
  </body>
</html>
